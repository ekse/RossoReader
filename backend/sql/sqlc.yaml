version: "2"
sql:
  - engine: "postgresql"
    queries: "queries/"
    schema: "../internal/db/migrations/"
    gen:
      go:
        package: "generated"
        out: "../internal/db/generated"
        sql_package: "pgx/v5"
        emit_interface: true
        emit_json_tags: true
        emit_pointers_for_null_types: true
