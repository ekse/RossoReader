services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rssreader
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - "8081:8080"
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/rssreader?sslmode=disable
      SERVER_PORT: "8080"
      FETCH_INTERVAL_MINUTES: "30"
      CORS_ORIGIN: http://localhost:5173
      SESSION_MAX_AGE_DAYS: "30"
      SESSION_COOKIE_NAME: session
      COOKIE_SECURE: "false"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_URL: http://localhost:8081
    depends_on:
      - api

volumes:
  postgres-data:
